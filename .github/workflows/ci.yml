name: CI

on: [pull_request]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    defaults:
      run:
        shell: bash -l {0} # a login shell is required for conda activation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}

      - name: Run linting
        run: pixi r lint

      - name: Run tests
        run: pixi r test
